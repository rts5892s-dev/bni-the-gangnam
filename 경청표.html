                        <button onclick="toggleAccordion(this)" class="w-full px-4 py-3 bg-gray-50 flex justify-between items-center border-b border-gray-100">
                            <h2 class="font-bold text-gray-800">${groupData.group} <span class="text-xs text-gray-500 font-normal ml-1">(${filteredMembers.length}명)</span></h2>
                            <svg class="w-5 h-5 text-gray-400 chevron ${isOpen ? 'open' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        
                        <!-- Accordion Content -->
                        <div class="accordion-content ${isOpen ? 'open' : ''} px-2 pb-2 pt-1 bg-white">
                            <div class="space-y-2 mt-2">
                                ${filteredMembers.map(m => `
                                    <div class="${m.style} rounded-lg p-3 flex gap-3 items-center">
                                        <!-- 번호 및 배지 -->
                                        <div class="flex flex-col items-center justify-center min-w-[40px]">
                                            <div class="text-sm font-black text-gray-700">${m.no}</div>
                                            ${m.badge === 'BNI' ? `<div class="text-[8px] bg-green-700 text-white px-1 mt-1 rounded font-bold tracking-tighter">BNI</div>` : ''}
                                        </div>
                                        
                                        <!-- 정보 -->
                                        <div class="flex-1 w-full">
                                            <div class="flex justify-between items-start mb-1">
                                                <div class="flex items-center gap-1.5">
                                                    <span class="font-bold text-base text-gray-900">${m.name}</span>
                                                    <span class="text-xs px-1.5 py-0.5 bg-white/60 rounded text-gray-700 border border-black/10">${m.type}</span>
                                                </div>
                                                <div class="text-[10px] font-bold text-red-600 bg-red-50 px-1.5 py-0.5 rounded border border-red-100 whitespace-nowrap">${m.role}</div>
                                            </div>
                                            <div class="text-sm font-bold text-gray-800 mb-0.5 truncate">${m.company}</div>
                                            <div class="text-xs text-gray-600 truncate leading-tight">${m.field}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', groupHTML);
            });

            if(container.innerHTML === '') {
                container.innerHTML = '<div class="text-center py-10 text-gray-500 text-sm">검색 결과가 없습니다.</div>';
            }
        }

        // 아코디언 토글 기능
        window.toggleAccordion = function(button) {
            const content = button.nextElementSibling;
            const chevron = button.querySelector('.chevron');
            
            content.classList.toggle('open');
            chevron.classList.toggle('open');
        }

        // 검색 이벤트 리스너
        searchInput.addEventListener('input', (e) => {
            renderData(e.target.value.trim());
        });

        // 초기 렌더링
        renderData();
    </script>
</body>
</html>
